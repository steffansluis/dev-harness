name: CI

on:
  push:
  pull_request:
    branches: [main, master]

# Generic CI template: lint → test+coverage → build → smoke-test → acceptance
#
# Substitute ALL_CAPS placeholders:
#   SETUP_STEPS    → steps to install runtime + dependencies
#   LINT_CMD       → lint command
#   TEST_CMD       → test command (must produce coverage output)
#   COVERAGE_DIR   → directory containing coverage report
#   BUILD_CMD      → build command
#   DIST_DIR       → build output directory
#   SERVER_CMD     → command to start a server in the background (append &)
#   PORT           → port the server listens on
#   E2E_CMD        → acceptance / e2e test command
#   E2E_OUTPUT_DIR → e2e output directory for artifacts

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SETUP_STEPS: install runtime and dependencies
      # Example (Node + bun):
      # - uses: oven-sh/setup-bun@v2
      # - run: bun install --frozen-lockfile

      - name: Run lint
        run: echo "SUBSTITUTE LINT_CMD"  # e.g. bun run lint / bundle exec rubocop

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SETUP_STEPS

      - name: Run tests with coverage
        run: echo "SUBSTITUTE TEST_CMD"  # e.g. pytest --cov / go test -coverprofile=...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/  # substitute COVERAGE_DIR
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      # SETUP_STEPS

      - name: Build
        run: echo "SUBSTITUTE BUILD_CMD"  # omit this job if there is no build step

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/  # substitute DIST_DIR
          retention-days: 30

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      # SETUP_STEPS

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/  # substitute DIST_DIR

      - name: Start server
        run: echo "SUBSTITUTE SERVER_CMD &"
        # The & runs it in the background so CI continues

      # IMPORTANT: Always smoke-test the server before running acceptance tests.
      # A broken server script will fail fast here instead of timing out across all tests.
      - name: Wait for server (smoke test)
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ && echo "Server ready" && exit 0
            echo "Waiting… ($i)"
            sleep 1
          done
          echo "Server did not start in time" && exit 1
        # substitute port 4173 with PORT

      - name: Run acceptance tests
        run: echo "SUBSTITUTE E2E_CMD"

      - name: Upload e2e output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output-${{ github.sha }}
          path: e2e/screenshots/  # substitute E2E_OUTPUT_DIR
          retention-days: 90
