name: CI

on:
  push:
  pull_request:
    branches: [main, master]

# Substitute:
#   PYTHON_VERSION   → e.g. '3.12'
#   LINT_CMD         → ruff check . / flake8 / pylint
#   TEST_CMD         → pytest --cov / python -m unittest discover
#   BUILD_CMD        → python -m build / omit if no build step
#   PORT             → app server port (e.g. 8000 for FastAPI/Django)
#   E2E_CMD          → pytest e2e/ / playwright test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # substitute PYTHON_VERSION
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt  # or: pip install -e ".[dev]"

      - name: Run lint
        run: ruff check .  # substitute LINT_CMD

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=html --cov-fail-under=80  # substitute TEST_CMD

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build  # substitute or remove BUILD_CMD

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 30

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Start app server
        run: uvicorn app.main:app --port 8000 &  # substitute PORT and start command

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ && echo "Server ready" && exit 0
            echo "Waiting… ($i)"
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - name: Run acceptance tests
        run: pytest e2e/  # substitute E2E_CMD
