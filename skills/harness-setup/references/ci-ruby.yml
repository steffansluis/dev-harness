name: CI

on:
  push:
  pull_request:
    branches: [main, master]

# Substitute:
#   RUBY_VERSION     → e.g. '3.3'
#   TEST_CMD         → bundle exec rspec / bundle exec rails test
#   BUILD_CMD        → bundle exec rake assets:precompile (Rails) or omit if no build step
#   PORT             → app server port (default Rails: 3000)
#   E2E_CMD          → bundle exec rspec spec/system / bundle exec cucumber

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'  # substitute RUBY_VERSION
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --no-color --format progress

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:  # remove if not using postgres
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up database
        run: bundle exec rails db:setup  # adjust as needed

      - name: Run tests with coverage
        run: bundle exec rspec --format progress  # substitute TEST_CMD
        env:
          COVERAGE: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Precompile assets
        run: bundle exec rake assets:precompile RAILS_ENV=production  # substitute BUILD_CMD
        env:
          SECRET_KEY_BASE: dummy

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Playwright / Capybara browser
        run: bunx playwright install chromium --with-deps
        # Or: bundle exec playwright install chromium

      - name: Start app server
        run: bundle exec rails server -p 3000 -d  # substitute PORT
        env:
          RAILS_ENV: test

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ && echo "Server ready" && exit 0
            echo "Waiting… ($i)"
            sleep 1
          done
          echo "Server did not start in time" && exit 1

      - name: Run acceptance tests
        run: bundle exec rspec spec/system  # substitute E2E_CMD
