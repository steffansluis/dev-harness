name: CI

on:
  push:
  pull_request:
    branches: [main, master]

# Substitute:
#   PACKAGE_MANAGER  → bun / npm / yarn / pnpm
#   INSTALL_CMD      → bun install --frozen-lockfile / npm ci / yarn install --frozen-lockfile
#   RUN_PREFIX       → bun run / npm run / yarn / pnpm run
#   BUILD_CMD        → the build script name in package.json (e.g. build, export:web)
#   DIST_DIR         → the output directory (dist/, build/, out/)
#   PORT             → the port the dev server or preview server listens on
#   E2E_CMD          → the e2e test script name (e2e, test:e2e:ci)
#   E2E_OUTPUT_DIR   → e2e/screenshots/ or playwright-report/

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- bun ---
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # --- npm / yarn / pnpm (uncomment as needed) ---
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     cache: 'npm'  # or 'yarn' or 'pnpm'

      - name: Install dependencies
        run: bun install --frozen-lockfile
        # npm: run: npm ci
        # yarn: run: yarn install --frozen-lockfile
        # pnpm: run: pnpm install --frozen-lockfile

      - name: Run lint
        run: bun run lint

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build  # substitute BUILD_CMD

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/  # substitute DIST_DIR
          retention-days: 30

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/  # substitute DIST_DIR

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Start server
        run: node scripts/serve-web.mjs &
        # Substitute with your server start command.
        # For a Vite preview: bunx vite preview --port 4173 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ && echo "Server ready" && exit 0
            echo "Waiting… ($i)"
            sleep 1
          done
          echo "Server did not start in time" && exit 1
        # Substitute port 4173 with PORT

      - name: Run acceptance tests
        run: bun run e2e  # substitute E2E_CMD

      - name: Upload screenshots / report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output-${{ github.sha }}
          path: e2e/screenshots/  # substitute E2E_OUTPUT_DIR
          retention-days: 90

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: e2e/report/
          retention-days: 30
